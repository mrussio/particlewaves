<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particles — Field Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Inter+Tight:wght@200;300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <header class="title" aria-label="Particles">
      <svg class="title-mark" viewBox="0 0 28 28" aria-hidden="true">
        <g fill="currentColor">
          <circle cx="4" cy="4" r="0.9" opacity="0.25" />
          <circle cx="14" cy="4" r="0.9" opacity="0.45" />
          <circle cx="24" cy="4" r="0.9" opacity="0.25" />
          <circle cx="4" cy="14" r="0.9" opacity="0.45" />
          <circle cx="14" cy="14" r="2.4">
            <animate attributeName="r" values="2.2;2.8;2.2" dur="2.4s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite" />
          </circle>
          <circle cx="24" cy="14" r="0.9" opacity="0.45" />
          <circle cx="4" cy="24" r="0.9" opacity="0.25" />
          <circle cx="14" cy="24" r="0.9" opacity="0.45" />
          <circle cx="24" cy="24" r="0.9" opacity="0.25" />
        </g>
        <circle cx="14" cy="14" r="6" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.12" />
        <circle cx="14" cy="14" r="11" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.06" />
      </svg>
      <h1 class="title-word">
        <span>P</span><span>A</span><span>R</span><span>T</span><span>I</span><span>C</span><span>L</span><span>E</span><span>S</span>
      </h1>
      <p class="title-tag">v0.1 — field generator</p>
    </header>

    <aside class="panel" id="panel" aria-label="Settings">
      <header class="panel-head">
        <div class="panel-id">
          <span class="panel-dot"></span>
          <span class="panel-name">Field</span>
        </div>
        <button class="panel-collapse" id="panel-collapse" aria-label="Collapse panel">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <div id="hud-fps">— fps</div>
    <div id="cursor-glow" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
